    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#94a3b8" stroke-opacity=".055"/>
    </pattern>
    <filter id="glow"><feGaussianBlur stdDeviation="8"/></filter>
  </defs>

  <rect width="1200" height="360" rx="22" fill="url(#bg)"/>
  <rect width="1200" height="360" rx="22" fill="url(#grid)"/>
  <circle cx="1040" cy="-10" r="230" fill="#22d3ee" opacity=".055" filter="url(#glow)"/>
  <circle cx="1140" cy="315" r="180" fill="#34d399" opacity=".045" filter="url(#glow)"/>

  <g opacity=".35" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M742 255 L787 236 L832 243 L877 187 L922 205 L967 143 L1012 163 L1057 92 L1102 113 L1150 60" stroke="#22d3ee" stroke-width="3"/>
    <path d="M742 286 L787 274 L832 282 L877 252 L922 263 L967 221 L1012 232 L1057 194 L1102 204 L1150 172" stroke="#34d399" stroke-width="2" opacity=".55"/>
    <g stroke="#64748b" stroke-width="2">
