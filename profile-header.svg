      <path d="M910 166v74m-8-44h16v25h-16z"/><path d="M972 117v78m-8-52h16v31h-16z"/>
      <path d="M1034 126v65m-8-41h16v22h-16z"/><path d="M1096 71v81m-8-51h16v29h-16z"/>
    </g>
