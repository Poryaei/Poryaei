  <circle cx="78" cy="67" r="4" fill="#34d399"/>
  <text x="91" y="72" fill="#a5f3fc" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" letter-spacing="1">BUILDING NOW</text>

  <text x="58" y="148" fill="#f8fafc" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="52" font-weight="700" letter-spacing="-1.5">Abolfazl Poryaei</text>
  <rect x="58" y="171" width="82" height="4" rx="2" fill="url(#accent)"/>
  <text x="58" y="219" fill="#cbd5e1" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="23">Software engineering for markets, data, and agents.</text>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14">
